<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabPilot</title>
</head>
<body>
    <h1>TabPilot</h1>
    <p id="access-status">Access disabled</p>
    <button id="toggle-access" type="button" disabled>Enable access</button>
    <button id="read-page" type="button" disabled>Read page</button>
    <hr>
    <label for="bridge-token">Local pairing token</label>
    <input id="bridge-token" type="password" autocomplete="off">
    <button id="connect-bridge" type="button">Connect local bridge</button>
    <p id="bridge-status" aria-live="polite">Bridge disconnected</p>
    <pre id="snapshot-output" aria-live="polite"></pre>
    <script src="popup.js"></script>
</body>
</html>
